name: Post AI News to Discord

# ===========================================================
# 実行トリガー
#   - schedule: 毎日 23:30 UTC = 翌日 08:30 JST に実行
#   - workflow_dispatch: GitHub UI から手動実行
# ===========================================================
on:
  schedule:
    - cron: "30 23 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # claude-code-action@v1 が GitHub App OIDC で必要

jobs:
  # ===========================================================
  # Job 1: ニュース取得
  #   複数RSSから取得し news.json をアーティファクト化
  # ===========================================================
  fetch-news:
    name: Fetch AI news from RSS feeds
    runs-on: ubuntu-latest
    outputs:
      has_news: ${{ steps.check.outputs.has_news }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser

      - name: Fetch news
        env:
          NEWS_OUTPUT_PATH: news.json
          PER_FEED_LIMIT: "3"
          TOTAL_LIMIT: "15"
        run: python news_fetcher.py

      - name: Check news count
        id: check
        run: |
          COUNT=$(python -c "import json; print(json.load(open('news.json'))['count'])")
          echo "Fetched $COUNT news items"
          if [ "$COUNT" -gt 0 ]; then
            echo "has_news=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_news=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload news artifact
        uses: actions/upload-artifact@v4
        with:
          name: news-json
          path: news.json
          retention-days: 7

  # ===========================================================
  # Job 2: 要約 (Claude Code GitHub Actions)
  #   news.json を読んで summary.json を生成させる
  #   summary.json は Discord Embed 投稿用の構造化データ
  # ===========================================================
  summarize:
    name: Summarize news with Claude Code Action
    runs-on: ubuntu-latest
    needs: fetch-news
    if: needs.fetch-news.outputs.has_news == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download news artifact
        uses: actions/download-artifact@v4
        with:
          name: news-json
          path: .

      - name: Prepare today's date (JST)
        id: date
        run: echo "today=$(TZ=Asia/Tokyo date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # ---- Claude Code Action による要約 ----
      # prompt 入力に「news.json を読み summary.json を作成せよ」と依頼。
      # Read/Write/Bash ツールを許可することで、Claude が
      # ワーキングディレクトリのファイルを操作できるようにする。
      - name: Generate summary with Claude Code Action
        uses: anthropics/claude-code-action@v1
        with:
          # サブスクリプション認証 (Claude Pro/Max プランの利用枠を消費)
          # ローカルで `claude setup-token` を実行して取得したOAuthトークンを
          # CLAUDE_CODE_OAUTH_TOKEN というSecret名で登録しておくこと。
          # APIキー従量課金にしたい場合は、代わりに以下の行を使う:
          #   anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools Read,Write,Bash
            --max-turns 10
          prompt: |
            あなたはAIニュースを日本のビジネス読者向けに要約する編集者です。

            このリポジトリのワーキングディレクトリには `news.json` というファイルがあります。
            これは複数のRSSフィードから取得した直近のAI関連ニュース一覧です。
            JSONには `count`(件数)、`categories`(カテゴリ別グルーピング)、
            `items`(個別記事配列) が含まれます。

            # あなたのタスク
            1. `news.json` を Read ツールで読み込む
            2. 各記事に対して日本語1〜2文の要約を作成する
            3. 結果を `summary.json` に Write ツールで保存する (Discord Embed投稿用の構造化データ)
            4. 完了したら何件要約したか報告する

            # summary.json のスキーマ (厳守)
            ```json
            {
              "date": "${{ steps.date.outputs.today }}",
              "count": <実際の件数(整数)>,
              "items": [
                {
                  "category": "general" | "research" | "vendor",
                  "title": "<元記事のタイトルそのまま>",
                  "url": "<元記事のURLそのまま>",
                  "source": "<出典名 (例: ITmedia AI+)>",
                  "region": "jp" | "global",
                  "summary": "<日本語1〜2文の要約>"
                }
              ]
            }
            ```

            # 注意
            - 出力は**純粋なJSONファイル**にすること (Markdownのコードブロックや前置き・後書きは付けない)
            - `title` / `url` / `source` / `region` / `category` は `news.json` の値を改変せずそのまま使う
            - `news.json` に無い情報を創作しない
            - 各 `summary` は1〜2文・日本語・150文字以内を目安
            - `items` の並び順は `news.json` の順序に従う
            - `summary.json` への書き込みが完了するまでタスクを終了しない

      - name: Verify summary was generated
        run: |
          if [ ! -f summary.json ] || [ ! -s summary.json ]; then
            echo "❌ summary.json was not generated or is empty"
            exit 1
          fi
          python -c "import json; d=json.load(open('summary.json',encoding='utf-8')); items=d.get('items'); assert isinstance(items, list) and items, 'items missing or empty'; print(f'✅ summary.json OK ({len(items)} items)')"

      - name: Upload summary artifact
        uses: actions/upload-artifact@v4
        with:
          name: summary-json
          path: summary.json
          retention-days: 7

  # ===========================================================
  # Job 3: Discord 投稿
  # ===========================================================
  notify-discord:
    name: Post summary to Discord
    runs-on: ubuntu-latest
    needs: summarize
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Download summary artifact
        uses: actions/download-artifact@v4
        with:
          name: summary-json
          path: .

      - name: Send to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SUMMARY_PATH: summary.json
        run: python discord_notifier.py
